rules:
  - type: advance_booking
    name: default_advance_booking
    code: ADV-001
    severity: error
    blocking: true
    min_days_domestic: 7
    min_days_international: 14
    # Match whole comma-separated destination components; extend for other destinations.
    international_destinations:
      - argentina
      - australia
      - austria
      - belgium
      - brazil
      - canada
      - chile
      - china
      - colombia
      - costa rica
      - czech republic
      - czechia
      - denmark
      - egypt
      - finland
      - france
      - germany
      - greece
      - hong kong
      - india
      - indonesia
      - ireland
      - israel
      - italy
      - japan
      - kenya
      - malaysia
      - mexico
      - morocco
      - netherlands
      - new zealand
      - nigeria
      - norway
      - peru
      - philippines
      - poland
      - portugal
      - saudi arabia
      - singapore
      - south africa
      - south korea
      - spain
      - sweden
      - switzerland
      - taiwan
      - thailand
      - turkey
      - united arab emirates
      - united kingdom
      - uk
      - vietnam
      - international
      - overseas

  - type: budget_limit
    name: default_budget_limit
    code: BUD-001
    severity: error
    blocking: true
    trip_limit: 5000
    category_limits:
      lodging: 2500
      meals: 800

  - type: duration_limit
    name: default_duration_limit
    code: DUR-001
    severity: warning
    blocking: false
    max_consecutive_days: 14

  - type: provider_approval
    name: approved_provider_warning
    code: PROV-001
    severity: warning
    blocking: false
    providers_path: config/providers.yaml
